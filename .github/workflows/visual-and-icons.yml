name: Visual + Icon Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Icon & manifest audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Regenerate icons from source logo
        run: bun run icons
      - name: Audit icons & manifest
        run: bun run audit:icons
      - name: Fail if icons drifted from source
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            echo "::error::public/ icons are out of date. Run 'bun run icons' and commit."
            git --no-pager diff --stat public/
            exit 1
          fi

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run visual regression suite
        run: bun run test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
